name = "leanchess"
version = "0.1.0"
defaultTargets = ["LeanChess", "ExampleCases"]

[[require]]
name = "leandb"
path = "../leandb"

[[require]]
name = "leanreact"
path = "../leanreact"

[[lean_lib]]
name = "LeanChess"
globs = ["LeanChess", "domain.Game", "domain.Deep", "domain.Lazier", "domain.Semantics"]

[[lean_lib]]
name = "ExampleCases"
globs = ["example_cases.+"]
roots = ["example_cases.flows"]

[[lean_lib]]
name = "api"
globs = ["api.+"]

[[lean_lib]]
name = "ui"
globs = ["ui.App"]

[[lean_exe]]
name = "leanchess-api"
root = "api.Main"

[[lean_exe]]
name = "leanchess-audit"
root = "api.Audit"
